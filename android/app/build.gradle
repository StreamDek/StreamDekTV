apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "org.jetbrains.kotlin.plugin.compose"

def projectRoot = rootDir.getAbsoluteFile().getParentFile().getAbsolutePath()
def envProperties = new Properties()
def envFile = new File(projectRoot, ".env")
if (envFile.exists()) {
    envFile.withInputStream { stream -> envProperties.load(stream) }
}
def streamDekApiUrl = (
    envProperties.getProperty("STREAMDEK_API_URL")
        ?: envProperties.getProperty("EXPO_PUBLIC_API_BASE_URL")
        ?: "http://192.168.0.2:3000"
).trim()
def otaManifestPath = (
    envProperties.getProperty("STREAMDEK_OTA_MANIFEST_PATH")
        ?: "/public/updates/android-tv/latest"
).trim()
// Local builds default ahead of anything the release manifest will advertise, so the update
// prompt stays out of the way during development. CI still passes the real values in.
// Premiumize's OAuth client id, for signing in on a remote without typing an API key.
//
// Not a secret: a television is a public OAuth client, so anything compiled in can be read back
// out of the package. Premiumize's device flow asks only for this id, and the client secret issued
// alongside it is deliberately not built in — there is nowhere in a shipped binary to keep it.
// Blank simply hides the option.
def premiumizeClientId = (
    envProperties.getProperty("STREAMDEK_PREMIUMIZE_CLIENT_ID")
        ?: System.getenv("STREAMDEK_PREMIUMIZE_CLIENT_ID")
        ?: ""
).toString().trim()

def ciVersionName = (findProperty("STREAMDEK_VERSION_NAME") ?: System.getenv("STREAMDEK_VERSION_NAME") ?: "99.0.0-dev").toString()
def ciVersionCode = (findProperty("STREAMDEK_VERSION_CODE") ?: System.getenv("STREAMDEK_VERSION_CODE") ?: "999999").toString().toInteger()
def ciStoreFile = System.getenv("ANDROID_KEYSTORE_PATH")
def ciStorePassword = System.getenv("ANDROID_STORE_PASSWORD")
def ciKeyAlias = System.getenv("ANDROID_KEY_ALIAS")
def ciKeyPassword = System.getenv("ANDROID_KEY_PASSWORD")
def ciSigningEnabled = ciStoreFile && ciStorePassword && ciKeyAlias && ciKeyPassword

android {
    namespace "com.streamdek.tv"
    compileSdk 36
    buildToolsVersion "36.0.0"

    defaultConfig {
        applicationId "com.streamdek.tv"
        minSdk 24
        targetSdk 36
        versionCode ciVersionCode
        versionName ciVersionName
        buildConfigField "String", "STREAMDEK_API_URL", "\"${streamDekApiUrl}\""
        buildConfigField "String", "STREAMDEK_OTA_MANIFEST_PATH", "\"${otaManifestPath}\""
        buildConfigField "String", "PREMIUMIZE_CLIENT_ID", "\"${premiumizeClientId}\""
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    buildFeatures {
        compose true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    composeOptions {
        kotlinCompilerExtensionVersion "1.5.15"
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        release {
            if (ciSigningEnabled) {
                storeFile file(ciStoreFile)
                storePassword ciStorePassword
                keyAlias ciKeyAlias
                keyPassword ciKeyPassword
            }
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig ciSigningEnabled ? signingConfigs.release : signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packaging {
        jniLibs {
            pickFirsts += ["**/libc++_shared.so"]
        }
    }
}

dependencies {
    testImplementation("junit:junit:4.13.2")
    // A real org.json on the unit-test classpath. The android.jar stub throws from every method, so
    // the trailer format-selection tests — which parse YouTube's player response — cannot run
    // against it. Same version the mobile app tests these with.
    testImplementation("org.json:json:20251224")
    implementation files("libs/libmpv-release.aar")
    implementation files("libs/lib-decoder-ffmpeg-release.aar")
    implementation("androidx.media3:media3-exoplayer:1.8.0")
    implementation("androidx.media3:media3-exoplayer-hls:1.8.0")
    implementation("androidx.media3:media3-exoplayer-dash:1.8.0")
    implementation("androidx.media3:media3-exoplayer-rtsp:1.8.0")
    implementation("androidx.media3:media3-datasource:1.8.0")
    implementation("androidx.media3:media3-ui:1.8.0")
    implementation platform("androidx.compose:compose-bom:2024.09.00")
    implementation("androidx.activity:activity-compose:1.9.3")
    implementation("androidx.appcompat:appcompat:1.7.0")
    implementation("androidx.compose.foundation:foundation")
    implementation("androidx.compose.material3:material3")
    implementation("androidx.compose.material:material-icons-extended")
    implementation("androidx.compose.runtime:runtime")
    implementation("androidx.compose.ui:ui")
    implementation("androidx.compose.ui:ui-tooling-preview")
    implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")
    implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")
    implementation("androidx.navigation:navigation-compose:2.8.5")
    implementation("androidx.palette:palette-ktx:1.0.0")
    implementation("androidx.tv:tv-material:1.0.1")
    implementation("io.coil-kt:coil-compose:2.7.0")

    // --- CloudStream (.cs3) plugin support ---
    // A .cs3 extension is compiled Kotlin/JVM bytecode written against the real
    // `com.lagradost.cloudstream3` provider API, so that API has to exist on this app's own
    // runtime classpath before a loaded plugin's superclasses (Plugin/BasePlugin/MainAPI/...)
    // can resolve. There is no Maven artifact for it: the jar every extension repo compiles
    // against is published as a plain release asset at
    //   https://github.com/recloudstream/cloudstream/releases/download/pre-release/classes.jar
    // (that is exactly what recloudstream's own Gradle plugin downloads for `compileOnly`).
    //
    // libs/cloudstream-provider-runtime.jar is that jar trimmed to the provider-facing runtime:
    // the model layer, MainAPI/APIHolder, utils, extractors, network, mvvm, metaproviders,
    // syncproviders and the plugin base classes — with CloudStream's own UI, player, downloader
    // and database packages removed, since nothing a provider calls reaches them. Regenerate it
    // by re-trimming a newer classes.jar if plugins start failing on a newer plugin apiVersion.
    //
    // NOTE: CloudStream is GPL-3.0. Shipping these classes has licensing consequences for
    // StreamDek's own distribution - that is a product decision, not a technical one.
    implementation files("libs/cloudstream-provider-runtime.jar")

    // Versions below are pinned to recloudstream/cloudstream's own gradle/libs.versions.toml so
    // the trimmed runtime (and the plugins compiled against it) link against what they expect.
    implementation("com.github.Blatzar:NiceHttp:0.4.18")
    implementation("com.fasterxml.jackson.module:jackson-module-kotlin:2.13.1")
    implementation("org.jetbrains.kotlinx:kotlinx-serialization-json:1.11.0")
    implementation("org.jetbrains.kotlinx:kotlinx-datetime:0.8.0")
    implementation("dev.whyoleg.cryptography:cryptography-core:0.6.0")
    implementation("dev.whyoleg.cryptography:cryptography-provider-optimal:0.6.0")
    implementation("io.ktor:ktor-http:3.5.0")
    implementation("com.fleeksoft.ksoup:ksoup:0.2.6")
    implementation("org.mozilla:rhino:1.8.1")
    implementation("io.coil-kt.coil3:coil:3.3.0")
    implementation("androidx.preference:preference-ktx:1.2.1")
    // Used directly by a number of extensions rather than by the runtime itself.
    implementation("com.google.code.gson:gson:2.11.0")
    implementation("com.google.code.gson:gson:2.11.0")
    implementation("com.squareup.okhttp3:okhttp:4.12.0")
    implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2")
    // Synced plugin sources are JavaScript scrapers: they run in the same QuickJS sandbox the
    // mobile app uses, and parse HTML through the same Jsoup-backed cheerio shim.
    implementation("org.jsoup:jsoup:1.18.3")
    implementation files("libs/quickjs-runtime.aar")
    debugImplementation("androidx.compose.ui:ui-tooling")
}
